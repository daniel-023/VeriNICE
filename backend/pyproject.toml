[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "verigraph-backend"
version = "0.7.0"
description = "Claim decomposition, evidence retrieval, grounded evidence auditing, and linguistic inspection for VeriGraph"
requires-python = ">=3.10,<3.14"
dependencies = [
  "annotated-doc==0.0.5",
  "annotated-types==0.7.0",
  "blis==1.3.3",
  "catalogue==2.0.10",
  "certifi==2026.7.22",
  "charset-normalizer==3.4.9",
  "click==8.2.1",
  "cloudpathlib==0.24.0",
  "confection==0.1.5",
  "cymem==2.0.13",
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "idna==3.18",
  "jinja2==3.1.6",
  "langcodes==3.5.1",
  "markdown-it-py==3.0.0",
  "markupsafe==3.0.3",
  "mdurl==0.1.2",
  "murmurhash==1.0.15",
  "numpy==2.0.2",
  "packaging==26.3",
  "preshed==3.0.13",
  "pydantic==2.10.6",
  "pydantic-core==2.27.2",
  "pygments==2.20.0",
  "pysbd==0.3.4",
  "python-dotenv==1.0.1",
  "requests==2.32.5",
  "rich==15.0.0",
  "sentence-transformers==3.4.1",
  "scikit-learn==1.6.1",
  "scipy==1.13.1",
  "joblib==1.5.3",
  "pillow==11.3.0",
  "shellingham==1.5.4",
  "smart-open==7.5.0",
  "setuptools==75.8.2",
  "spacy==3.8.7",
  "spacy-legacy==3.0.12",
  "spacy-loggers==1.0.5",
  "srsly==2.5.3",
  "thinc==8.3.9",
  "threadpoolctl==3.6.0",
  "tqdm==4.70.0",
  "typer==0.23.2",
  "typer-slim==0.23.2",
  "typing-extensions==4.16.0",
  "urllib3==2.6.3",
  "wasabi==1.1.3",
  "weasel==0.4.3",
  "wrapt==2.3.0",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "torch==2.6.0",
  "transformers==4.48.3",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
data = [
  "pypdf==5.9.0",
  "trafilatura==1.12.2",
]
test = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["verigraph_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: slow tests that load a packaged local model",
]
