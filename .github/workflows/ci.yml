name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --requirement backend/requirements.lock
      - run: python -m pip install --editable 'backend[test]'
      - run: python -m pytest backend/tests
      - run: python -m pip install pip-audit
      - run: python -m pip_audit --requirement backend/requirements.lock --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: node scripts/verify-walkthrough.mjs
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
